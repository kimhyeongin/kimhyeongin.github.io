<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 대시보드</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>우리 대시보드</h1>
  <p>서버가 정상적으로 열렸습니다 🎉</p>
  <p id="time"></p>
  <script>
    document.getElementById("time").textContent = "접속 시각: " + new Date().toLocaleString("ko-KR");
  </script>
</body>
</html>
