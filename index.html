<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 할 일</title>
<style>
  :root {
    --bg: #f6f7f4; --surface: #ffffff; --ink: #1d2a24; --muted: #6b7a72;
    --line: #dde3dd; --accent: #2f6f4f; --accent-ink: #ffffff; --danger: #b3412f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151b18; --surface: #1e2622; --ink: #e8efe9; --muted: #93a39a;
      --line: #2f3a34; --accent: #6fbf94; --accent-ink: #0f1a14; --danger: #e07a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent;
  }
  .add { padding: 0 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  li span { flex: 1; word-break: break-word; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  .del { background: none; color: var(--muted); padding: 4px 8px; }
  .del:hover { color: var(--danger); }
  .msg { color: var(--muted); padding: 20px 14px; text-align: center; }
  .err { color: var(--danger); margin-top: 12px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>우리 할 일</h1>
  <p class="sub">친구들과 함께 보는 공유 목록입니다.</p>

  <form id="form">
    <input type="text" id="text" placeholder="할 일을 입력하세요" maxlength="200" autocomplete="off" required>
    <button class="add" type="submit">추가</button>
  </form>

  <ul id="list"><li class="msg">불러오는 중…</li></ul>
  <div id="err" class="err" role="alert"></div>
</main>

<script>
  // ▼▼ Supabase에서 복사한 값을 여기에 붙여넣으세요 ▼▼
  const SUPABASE_URL = "https://jlujfxlzbnppmjclrrnk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Xygp5uno0IDwYHcm1cfj4A_mLX9CQ6w";
  // ▲▲ service_role 키는 절대 넣지 마세요 ▲▲

  const API = SUPABASE_URL + "/rest/v1/todos";
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  const listEl = document.getElementById("list");
  const errEl = document.getElementById("err");
  const inputEl = document.getElementById("text");

  function showError(e) {
    console.error(e);
    errEl.textContent = "저장소와 통신하지 못했습니다. URL과 키, 테이블 설정을 확인하세요.";
  }

  async function api(path, options) {
    const res = await fetch(API + path, { headers, ...options });
    if (!res.ok) throw new Error(res.status + " " + await res.text());
    return res.status === 204 ? null : res.json();
  }

  async function load() {
    try {
      errEl.textContent = "";
      const todos = await api("?select=*&order=created_at.asc");
      render(todos);
    } catch (e) { showError(e); listEl.innerHTML = '<li class="msg">불러오지 못했습니다.</li>'; }
  }

  function render(todos) {
    if (!todos.length) {
      listEl.innerHTML = '<li class="msg">아직 할 일이 없습니다. 위에서 추가해 보세요.</li>';
      return;
    }
    listEl.innerHTML = "";
    for (const t of todos) {
      const li = document.createElement("li");
      if (t.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.setAttribute("aria-label", "완료 표시");
      cb.onchange = async () => {
        try { await api("?id=eq." + t.id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }); load(); }
        catch (e) { showError(e); }
      };

      const span = document.createElement("span");
      span.textContent = t.text;

      const del = document.createElement("button");
      del.className = "del"; del.textContent = "삭제";
      del.onclick = async () => {
        try { await api("?id=eq." + t.id, { method: "DELETE" }); load(); }
        catch (e) { showError(e); }
      };

      li.append(cb, span, del);
      listEl.appendChild(li);
    }
  }

  document.getElementById("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    try {
      await api("", { method: "POST", body: JSON.stringify({ text }) });
      inputEl.value = "";
      load();
    } catch (e) { showError(e); }
  });

  load();
</script>
</body>
</html>
